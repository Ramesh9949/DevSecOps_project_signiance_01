apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier
  labels:
    role: frontend
    env: demo
spec: 
  replicas: 1
  strategy:https://github.com/Ramesh9949/End-to-End-Kubernetes-Three-Tier-DevSecOps-Project001/edit/master/Kubernetes-Manifests-file/Frontend/deployment.yaml
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  selector:
    matchLabels: 
      role: frontend
  template:
    metadata:
      labels:
        role: frontend
    spec: 
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: frontend
        image: 407622020962.dkr.ecr.ap-south-1.amazonaws.com/frontend:2
        imagePullPolicy: Always
        env:
          - name: REACT_APP_BACKEND_URL
            value: "http://bhavsingh.life"
        ports:
        - containerPort: 3000
